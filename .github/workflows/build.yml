name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            artifact: Windows-x64
            lock: dependency-lock.txt
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macOS-arm64
            lock: dependency-lock-macos.txt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install pinned native dependencies
        run: python -m pip install -r ${{ matrix.lock }}
      - name: Test, build and verify application
        run: python scripts/build.py
      - name: Package verified native build
        run: python scripts/package_release.py
      - name: Upload application and validation
        uses: actions/upload-artifact@v4
        with:
          name: PDFReader-${{ matrix.artifact }}
          path: work/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: |
            work/tests.xml
            work/smoke-source/*.json
            work/smoke-source/*.png
            work/smoke-packaged/*.json
            work/smoke-packaged/*.png
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish verified downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PDFReader-*
          merge-multiple: true
          path: work/release
      - name: Validate release versions and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_release.py
      - name: Publish ZIP downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" work/release/* --verify-tag --title "PDF Reader $RELEASE_TAG" --notes-file work/release-notes.md
